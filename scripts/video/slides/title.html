<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600&family=Geist+Mono&family=Instrument+Serif:ital@1&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0B0C0D; color: #EEE9DE; overflow: hidden; }
  #word { position: absolute; left: 0; right: 0; top: 300px; text-align: center; white-space: nowrap;
          font: 600 250px/1 Geist, "Segoe UI", sans-serif; letter-spacing: -.05em; opacity: 0; }
  #base { display: inline-block; width: 0; height: 0; }
  #rule { position: absolute; left: 0; right: 0; height: 8px; transform: scaleX(0); transform-origin: left;
          background: repeating-linear-gradient(90deg, #EEE9DE 0 44px, transparent 44px 66px); }
  #tittle { position: absolute; background: #FF4A3D; opacity: 0; }
  #line { position: absolute; left: 0; right: 0; top: 650px; text-align: center; font: 24px "Geist Mono", monospace; color: #8A9096; opacity: 0; }
  #line em { font: italic 34px "Instrument Serif", serif; color: #FF4A3D; }
  #url { position: absolute; left: 0; right: 0; top: 702px; text-align: center; font: 17px "Geist Mono", monospace; color: #5E646A; opacity: 0; }
  .go #rule { transition: transform .9s cubic-bezier(.2,.7,.1,1); transform: none; }
  .go #word { transition: opacity .7s .15s; opacity: 1; }
  .go #line { transition: opacity .7s .9s, transform .7s .9s; opacity: 1; }
  .go #url { transition: opacity .7s 1.1s; opacity: 1; }
  @keyframes drop { from { transform: translateY(-240px) rotate(40deg); opacity: 0; } 50% { opacity: 1; }
                    to { transform: translateY(0) rotate(-7deg); opacity: 1; } }
</style></head>
<body>
  <div id="rule"></div>
  <div id="word">s<span id="i">ı</span>eve<span id="base"></span></div>
  <div id="tittle"></div>
  <div id="line">catches the bad chunks before your LLM reads them</div>
  <div id="url"></div>
<script>
  const p = new URLSearchParams(location.search);
  if (p.get("line")) document.getElementById("line").innerHTML = p.get("line");
  if (p.get("url")) document.getElementById("url").textContent = p.get("url");

  // Same construction as docs/thumbnail.html: the dot of the i rests on the sieve line, over a gap it can't fit through.
  document.fonts.ready.then(() => {
    const word = document.getElementById("word"), cs = getComputedStyle(word), px = parseFloat(cs.fontSize);
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `${cs.fontWeight} ${px}px ${cs.fontFamily}`;
    const xh = ctx.measureText("x").actualBoundingBoxAscent;
    const m = ctx.measureText("ı"), stem = m.actualBoundingBoxRight + m.actualBoundingBoxLeft;
    const baseline = document.getElementById("base").getBoundingClientRect().top;
    const ib = document.getElementById("i").getBoundingClientRect(), cx = ib.left + ib.width / 2;
    const ruleTop = baseline - xh - px * .075 - 8, P = 66;
    const rule = document.getElementById("rule");
    rule.style.top = ruleTop + "px";
    rule.style.backgroundPositionX = (((cx - 55) % P) + P) % P + "px";
    const t = document.getElementById("tittle");
    Object.assign(t.style, { width: stem + "px", height: stem + "px", left: cx - stem / 2 + "px", top: ruleTop - stem + 2 + "px" });
    requestAnimationFrame(() => {
      document.body.classList.add("go");
      t.style.animation = "drop .75s .45s cubic-bezier(.3,1.35,.5,1) forwards";
    });
  });
</script>
</body></html>
