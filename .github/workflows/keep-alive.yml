name: keep demo awake

# Render's free plan sleeps a service after ~15 idle minutes, and the next visitor waits 30-60 s.
# Pinging the health check keeps the judges' first visit instant. /health makes no LLM calls.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (retries cover a cold start)
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://sieve-cms2.onrender.com/health; then exit 0; fi
            sleep 20
          done
          exit 1
